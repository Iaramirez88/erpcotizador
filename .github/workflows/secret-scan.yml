name: Secret Scan

# Escaneo de secretos BLOQUEANTE — PLAN-MAESTRO-REFACTORIZACION.md §4.9 (tarea 1.7).
# Cierra la Fase 0: si se cuela una clave real en el repositorio, el PR no pasa.
#
# Escanea TODO el historial (`--log-opts=--all`), no solo el diff del PR: así también
# detecta secretos antiguos que siguen siendo válidos y que hay que rotar.
#
# Ejecución local (pre-commit / manual):
#   gitleaks detect --source . --log-opts="--all" --config .gitleaks.toml --redact --verbose

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Lunes 06:00 UTC: reescaneo semanal del historial completo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Versión fijada a propósito: una actualización de gitleaks puede cambiar reglas
      # y romper el pipeline sin que el código haya cambiado.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Sale con código != 0 si encuentra cualquier hallazgo => job bloqueante.
      - name: Detectar secretos (bloqueante)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --redact \
            --verbose
